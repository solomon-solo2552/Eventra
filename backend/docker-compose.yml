services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventra_db
      POSTGRES_USER: eventra_user
      POSTGRES_PASSWORD: eventra_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventra_user -d eventra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: